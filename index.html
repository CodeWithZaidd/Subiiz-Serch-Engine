    <script>
        let inpttt = document.getElementById("serach_engine2");
        let PLaceholder = "Search on Subiiz";
        let index = 0;
        function typing(){

            if(index < PLaceholder.length){
                inpttt.placeholder += PLaceholder.charAt(index);
                index++;
                setTimeout(typing, 150);
            }else{
                setTimeout(()=>{
                    inpttt.placeholder = "";
                    index = 0;
                    typing();
                }, 2000);
            }

        }
        typing();

        let inppttt = document.getElementById("serach_engine");
        let PLacehpolder = "Search on Subiiz";
        let indexp = 0;
        function typing1(){

            if(indexp < PLacehpolder.length){
                inppttt.placeholder += PLacehpolder.charAt(indexp);
                indexp++;
                setTimeout(typing1, 150);
            }else{
                setTimeout(()=>{
                    inppttt.placeholder = "";
                    indexp = 0;
                    typing1();
                }, 2000);
            }

        }
        typing1();
        
        function addShortcut(){
            let dabbaADD = document.querySelector(".addShortcut");

            dabbaADD.style.display = "flex";
        }
        function closeAA(){
            let dabbahat = document.querySelector(".addShortcut");

            dabbahat.style.display = "none";
            document.querySelector(".NAMENN").value = "";
            document.querySelector(".urlll").value = "";

            CHECKING();
        }
        function CHECKING(){ 
         let nameW = document.querySelector(".NAMENN").value.trim();
         let urlW = document.querySelector(".urlll").value.trim();

         if (nameW !== "" && urlW !== "" ){
            let btnnddd = document.querySelector(".btn-done , .btn-donee");

            btnnddd.className = "btn-donee";
            
         }

         else{
            let btnnddd = document.querySelector(".btn-done, .btn-donee");
            btnnddd.className = "btn-done";
         }
        }       

        function doneAA(){
            let nameW = document.querySelector(".NAMENN").value.trim();
            let urlW = document.querySelector(".urlll").value.trim();
            let addDiv = document.querySelector(".addShortcut");


            if(window.getComputedStyle(addDiv).display === "none") {
                return;
            }
            if (nameW == "" && urlW == ""){return;}
            if (!urlW.startsWith("http://") && !urlW.startsWith("https://")){
                urlW = "https://" + urlW;

            }
            let googleAPI = `https://www.google.com/s2/favicons?domain=${urlW}&sz=64`;
            let container = document.querySelector(".shortcutNEWW")

            let shortcutsHTML = `
            <a href="${urlW}" target="_self" class="shortcut-cardss" title="${nameW}">
                <span class="three-dot" onclick="deleteShortcut(event, this)">&#8942;</span>
                <div class="icon-boxx">
                    <img src="${googleAPI}" alt="${nameW}" class="shorimg">
                </div>
                <span class="shotcut-title">${nameW}</span>
            </a> 
            `;
            container.insertAdjacentHTML("beforeend", shortcutsHTML);
            localStorage.setItem("myShortcutt", (localStorage.getItem("myShortcutt") || "")+ shortcutsHTML);
            closeAA();
        }
        function deleteShortcut(e,btn){
            e.preventDefault();

            let card = btn.closest(".shortcut-cardss");
            card.remove();

            let reamingHTML = "";
            document.querySelectorAll(".shortcut-cardss").forEach(c =>{
                reamingHTML += c.outerHTML;
            });
            localStorage.setItem("myShortcutt", reamingHTML);

        }
        document.querySelector(".shortcutNEWW").insertAdjacentHTML("beforeend", localStorage.getItem("myShortcutt") || "");

        async function triggerSearch(event){
            if (event.key === 'Enter'){

                if (window.speechSynthesis.speaking){
                    window.speechSynthesis.cancel();
                }
                let inppt = event.target.value.trim();
                if(inppt !== ""){
                    document.querySelector("#serach_engine").value = inppt;
                    document.querySelector("#serach_engine2").value = inppt;
                    document.querySelector(".zaid").style.display = "none";
                    document.querySelector(".search-result-here").style.display = "flex";
                    
                    let linkBox = document.querySelector(".linksss");
                    
                    let aiBox = document.querySelector(".AI_RESULT");
                    
                    aiBox.innerHTML = `<span class="fire_gradients">Thinking..........</span>`;
                    
                    linkBox.innerHTML = `<h1 class="colofull_gradients">Finding Best Result..........</h1>`;

        
                    // --- 1. AI RESPONSE FETCH (Independent) ---
         
                    try {
         
                        let AIresponse = await fetch(`http://192.168.113.125:5000/ai-response?q=${encodeURIComponent(inppt)}`);
         
                        let AIdata = await AIresponse.json();

         
                        if (AIdata && AIdata.Reply) {
         
                            aiBox.innerHTML = `
         
                            <div style="display: flex;flex-direction: row;justify-content: flex-start;white-space: nowrap; align-items: center; margin-left: 0;">
         
                                <h2 style="font-size: 15px; color: black; font-weight: bolder; display: block; padding: 10px 20px 0 20px;margin-left: 20px;">SERACH RESULT</h2>
         
                                <span style="border: 0.5px solid #ccc;cursor:pointer;color:blue; height:22px;font-size: 11px; border-radius:25px;margin-left: 4px; margin-right: 4px; display: inline-flex; justify-content: center; align-items: center;box-sizing: border-box;padding: 0 10px;" onclick="toggle_eng_hindi()" id="toggle_eng_hindi" title="Speak To Eng And Hindi">English</span>
         
                                <span onclick="speakAIResult()" style="cursor: pointer; display: inline-flex; align-items: center; justify-content: center; margin-left: 2px; vertical-align: middle;" class="speaker_icon" title="Listen"><svg width="22" height="22" viewBox="0 0 24 24" fill="#00d2ff"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></span>
         
                                </div>
         
                                <span style="font-size: 12px; color: #1a73e8; font-weight: 600;margin-left: 50px;margin-bottom: 20px; margin-top: -6px; width: 160px;height: 20px;">AI OVERVIEW / TOP RESULT</span>
         
                                <div style="margin-left:20px; padding: 0 20px;" id="ai_text_speech">${AIdata.Reply}</div>
         
                                `;
         
                            } else {
         
                                aiBox.innerHTML = `
         
                                <div style="padding: 20px;">
         
                                    <h1 style="color: #d93025;margin: 0 0 8px 0;">NO AI ANSWER FOUND!!</h1>
         
                                    </div>`;
         
                                }
         
                            } catch (err) {
         
                                console.error("AI Fetch Error:", err);
         
                                aiBox.innerHTML = `
         
                                <div style="padding: 20px;">
          
                                    <h1 style="color: #d93025;margin: 0 0 8px 0;">AI BACKEND ERROR</h1>
          
                                    <a href="https://www.google.com/search?q=${encodeURIComponent(inppt)}" target="_blank" style="color: blue; cursor: pointer;">TAP TO SEARCH ON GOOGLE</a>
          
                                    </div>`;
          
                                }

          
                                // --- 2. SEARCH LINKS FETCH (Independent) ---
          
                                try {
          
                                    let response = await fetch(`http://192.168.113.125:5000/search?q=${encodeURIComponent(inppt)}`);
          
                                    let data = await response.json();


                
                                    if(data && data.results && data.results.length > 0){
         
                                        linkBox.innerHTML = `
         
                                        <h1 style="color: black; font-weight: bolder; display: block; padding: 10px 20px 0 20px">SEARCH RESULTS</h1>
         
                                        `;
         
                                        data.results.forEach((item, index)=>{ 
         
                                            linkBox.innerHTML += `
         
                                            <div style="padding: 10px 20px;">
         
                                                <a href="${item.href}" target="_blank" style="font-size: 18px; color: #1a0dab; font-weight: bold; display: block;margin-bottom: 4px">
         
                                                    ${index + 1}. ${item.title || 'Result'}
         
                                                    </a>
         
                                                    <p style="color: #3c4043; margin-bottom: 5px; font-size: 14px;">${item.body}</p>
         
                                                    </div>
         
                                                    `;
         
                                                });
         
                                            } else {
         
                                                linkBox.innerHTML = `
         
                                                <div style="padding: 20px;">
         
                                                    <h1 style="color: #d93025;margin: 0 0 8px 0;">NO WEB LINKS FOUND!!</h1>
         
                                                    <a href="https://www.google.com/search?q=${encodeURIComponent(inppt)}" target="_blank" style="color: blue; cursor: pointer;">TAP TO SEARCH ON GOOGLE</a>
         
                                                    </div>`;
         
                                                }
         
                                            } catch (err) {
         
                                                console.error("Search Fetch Error:", err);
         
                                                linkBox.innerHTML = `
         
                                                <div style="padding: 20px;">
         
                                                    <h1 style="color: #d93025;margin: 0 0 8px 0;">SEARCH BACKEND ERROR</h1>
         
                                                    <a href="https://www.google.com/search?q=${encodeURIComponent(inppt)}" target="_blank" style="color: blue; cursor: pointer;">TAP TO SEARCH ON GOOGLE</a>
         
                                                    </div>`;
         
                                                }

   
                                            }
   
                                        }
    

                                    }

        function trackerActi(actionName, detailsObj){
            fetch('/track',{
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    action: actionName,
                    details: detailsObj
                })
            }).catch(err => console.log("TRACKING FAILED"));
        }
        trackerActi("Page_Loaded", {url: window.location.href});

        document.addEventListener('click', (e) =>{
            let link = e.target.closest('a');
            if(link){
                trackerActi("LINK_USER_OPEN",{
                    TARGET_URL: link.href,
                    TEXT: link.href

                });
            }
            let donBT = document.querySelector(".btn-done");
         
            donBT.onclick  = () =>{
                let inpA = document.getElementById("inputA").value;
                let inpB = document.getElementById("inputB").value;
                trackerActi("USER_CREATED_SHORTCUT",{
                    SHORTCUT_NAME: inpA,
                    SHORTCUT_LINK : inpB
                });
            };

        });
        

       
       
        function goHome(){

            if (window.speechSynthesis.speaking){
                window.speechSynthesis.cancel();
            }
            document.querySelector(".search-result-here").style.display = "none";
            document.querySelector(".zaid").style.display = "flex";
            let aBox = document.querySelector(".AI_RESULT");
            let linkBox = document.querySelector(".linksss");

            aBox.innerHTML = "";
            linkBox.innerHTML = "";

        }
        function toggleShowMore(){
            let aiBox = document.querySelector(".AI_RESULT");
            let btnText = document.querySelector(".ShoMore");
            let btnArrow = document.querySelector(".arrow");

            if (aiBox.style.height === "auto" || aiBox.style.height === "100%"){
                aiBox.style.height = "36vh";
                aiBox.style.webkitMaskImage =  "linear-gradient(to bottom, white 30%, transparent 100%)";
                aiBox.style.maskImage = "linear-gradient(to bottom, white 30%, transparent 100%)";
                btnText.innerText = "SHOW MORE";
                btnArrow.className = "arrow down";
            }else{
                aiBox.style.height = "auto";
                aiBox.style.webkitMaskImage =  "none";
                aiBox.style.maskImage = "none";
                btnText.innerText = "SHOW LESS";
                btnArrow.className = "arrow up";
            }
        }
        let currentLang = 'en';

        function toggle_eng_hindi(){
            const langbtn = document.querySelector("#toggle_eng_hindi");
            if (!langbtn) return;

            if (currentLang === 'en'){
                currentLang = 'hi';
                langbtn.innerText = "Hindi";

            }else{
                currentLang = 'en';
                langbtn.innerText = "English";
            }

            if (window.speechSynthesis.speaking){
                window.speechSynthesis.cancel();

            }

        }

        let currentUtteranceQueue = [];
        let curentSenteceIdx = 0;

        function speakAIResult(){
            const aiResult = document.querySelector("#ai_text_speech");
            if (!aiResult) return;

            if (window.speechSynthesis.speaking){
                window.speechSynthesis.cancel();
                return;
            }
            let rawText = aiResult.innerText || aiResult.textContent;
            let cleanText = rawText
            .replace(/[*#`_~]/g, '')
            .replace(/https?:\/\/\S+/g, '')
            .replace(/\s+/g, ' ')
            .trim();

            if(!cleanText) return;
            if (!('speechSynthesis' in window)){
                window.speechSynthesis.cancel();
                alert("YOUR bROWSER NOT SUPPORT SPEECH");
                return;
            }

            let sentence = cleanText.replace(/([.!?\n])/g, "$1 |").split("|").filter(s => s.trim().length > 0);
            currentUtteranceQueue = sentence;
            curentSenteceIdx = 0;
            playNextChunck();
        }

        function playNextChunck(){ 

            if (curentSenteceIdx >= currentUtteranceQueue.length){
                window.speechUtteranceRef = null;
                return;
            }

            let textChunck = currentUtteranceQueue[curentSenteceIdx].trim();
            if(!textChunck){
                curentSenteceIdx++;
                playNextChunck();
                return;
            }

            let utterance = new SpeechSynthesisUtterance(textChunck);
            window.speechUtteranceRef = utterance;


            let voice = window.speechSynthesis.getVoices() || [];

            let targetLangCode = (currentLang === 'hi') ? 'hi-IN': 'en-US';
            let selectedVOice = voice.find(v => v.lang == targetLangCode) || 
            voice.find(v => v.lang.includes(currentLang)) || 
            voice.find(v => v.lang.includes('en-IN'));

            if (selectedVOice){
               utterance.voice = selectedVOice;
            }
            utterance.lang = targetLangCode;
            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            utterance.onend = function(){
                curentSenteceIdx++;
                playNextChunck();
            }

            if (window.speechSynthesis.paused){
                window.speechSynthesis.resume();
            }

            window.speechSynthesis.speak(utterance);

        }


        if ('speechSynthesis' in window){
            window.speechSynthesis.onvoiceschanged = function (){
                window.speechSynthesis.getVoices();
            };
        }

        window.addEventListener('beforeunload', () => {
            if (window.speechSynthesis.speaking){
                window.speechSynthesis.cancel();
            }
        });
    </script>
</HTML>
